<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">One cache, two very different results</title>
<desc id="d">On a MacBook Air with a local model, caching cut the time to first token from 3–4 s to 0.3 s. On Claude Sonnet 5.5, the same caching raised cost by +18–25%.</desc>
<rect width="1200" height="630" fill="#f3f4f6"/>
<text x="70" y="98" font-size="46" font-weight="800" fill="#0b0b0b" text-anchor="start">One cache. Two very different results.</text>
<rect x="70" y="150" width="500" height="340" rx="20" fill="#ffffff" stroke="#d6d8de" stroke-width="2"/>
<rect x="106" y="190" width="14" height="14" rx="3" fill="#2a78d6"/>
<text x="132" y="204" font-size="26" font-weight="600" fill="#52514e" text-anchor="start">MacBook Air, local Qwen3 4B</text>
<text x="106" y="336" font-size="96" font-weight="800" fill="#0b0b0b" text-anchor="start">0.3 s</text>
<text x="106" y="394" font-size="30" font-weight="600" fill="#0b0b0b" text-anchor="start">time to first token</text>
<text x="106" y="436" font-size="26" font-weight="400" fill="#52514e" text-anchor="start">down from 3–4 s</text>
<rect x="630" y="150" width="500" height="340" rx="20" fill="#ffffff" stroke="#d6d8de" stroke-width="2"/>
<rect x="666" y="190" width="14" height="14" rx="3" fill="#d95926"/>
<text x="692" y="204" font-size="26" font-weight="600" fill="#52514e" text-anchor="start">Claude Sonnet 5.5</text>
<text x="666" y="336" font-size="96" font-weight="800" fill="#0b0b0b" text-anchor="start">+18–25%</text>
<text x="666" y="394" font-size="30" font-weight="600" fill="#0b0b0b" text-anchor="start">cost with prompt caching</text>
<text x="666" y="436" font-size="26" font-weight="400" fill="#52514e" text-anchor="start">until prompts repeat</text>
<text x="70" y="556" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">Same RAG pipeline, same dataset (SQuAD). Every number is from logged runs.</text>
</svg>
